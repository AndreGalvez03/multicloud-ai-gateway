# Example only. Not applied by the Helm chart and not validated as a stock
# Kubernetes resource. External Secrets Operator copies provider credentials
# from AWS Secrets Manager into a Kubernetes Secret. The pod uses IRSA to read
# Bedrock; this secret is for third-party API keys that have no IAM equivalent.
#
# remoteRef.key is Terraform "${name}/providers" and the chart value
# secretsManagerSecret. This file is the prod name (envs/prod.tfvars,
# deploy/helm/aigw/values-prod.yaml). Dev is aigw-dev/providers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-gateway-providers
  namespace: aigw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-gateway-providers
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: aigw-prod/providers
        property: openai_api_key
