nameOverride: ai-gateway
fullnameOverride: ai-gateway
namespace: aigw

replicaCount: 2

image:
  repository: ghcr.io/example/ai-gateway
  tag: "0.1.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  nodePort: null

# Terraform secret name is "${name}/providers". The variable default name is aigw.
# dev.tfvars is aigw-dev (values-dev.yaml). prod.tfvars is aigw-prod (values-prod.yaml).
secretsManagerSecret: aigw/providers
databaseSecret: ai-gateway-db
adminSecret: ai-gateway-admin

providersSecret:
  enabled: true
  name: ai-gateway-providers

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  ingressApp: dashboard

irsaRoleArn: ""

# IRSA keeps aud=sts.amazonaws.com. These projected tokens are the other audiences.
# gcpTokenAudience matches google_iam_workload_identity_pool_provider allowed_audiences.
# azureTokenAudience matches azurerm_federated_identity_credential.
workloadIdentity:
  gcpTokenAudience: aigw-eks
  gcpPoolId: aigw-eks
  gcpProviderId: eks-oidc
  gcpProjectNumber: PROJECT_NUMBER
  gcpServiceAccountEmail: ai-gateway@PROJECT_ID.iam.gserviceaccount.com
  azureTokenAudience: api://AzureADTokenExchange
  azureClientId: ""
  azureTenantId: ""

litellmBaseUrl: http://litellm.aigw.svc.cluster.local:4000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

monitoringNamespace: monitoring
