replicaCount: 2

image:
  repository: ghcr.io/example/ai-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

irsaRoleArn: ""

litellmBaseUrl: http://litellm.aigw.svc.cluster.local:4000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

monitoringNamespace: monitoring
